<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Clean white background with very subtle border and slight shadow effect -->
  <rect width="100" height="100" fill="#ffffff" />
  <!-- Drop shadow definition -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>
  <!-- Main shape centered and scaled up -->
  <g transform="translate(15, 15) scale(2.9)" filter="url(#shadow)">
    <path d="M12 2C6.5 2 2 6.5 2 12c0 2 1.5 4 3.5 4h13c2 0 3.5-2 3.5-4 0-5.5-4.5-10-10-10z" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10c2-2 6-2 8 0M8 14c1.5-1 3.5-1 5 0" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>