<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Clean white background with very subtle border and slight shadow effect -->
  <rect width="100" height="100" fill="#ffffff" />
  <!-- Drop shadow definition -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>
  <!-- Main shape centered and scaled up -->
  <g transform="translate(15, 15) scale(2.9)" filter="url(#shadow)">
    <path d="M9 2h6v3H9zM10 5l-2 4v13h8V9l-2-4" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13" r="1" fill="#06b6d4"/><circle cx="10" cy="16" r="1" fill="#06b6d4"/><circle cx="14" cy="18" r="1" fill="#06b6d4"/>
  </g>
</svg>