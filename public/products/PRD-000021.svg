<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Clean white background with very subtle border and slight shadow effect -->
  <rect width="100" height="100" fill="#ffffff" />
  <!-- Drop shadow definition -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>
  <!-- Main shape centered and scaled up -->
  <g transform="translate(15, 15) scale(2.9)" filter="url(#shadow)">
    <path d="M5 2h14v20H5zM5 7h14M5 12h14M5 17h14M12 2v20" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>