<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Clean white background with very subtle border and slight shadow effect -->
  <rect width="100" height="100" fill="#ffffff" />
  <!-- Drop shadow definition -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>
  <!-- Main shape centered and scaled up -->
  <g transform="translate(15, 15) scale(2.9)" filter="url(#shadow)">
    <ellipse cx="12" cy="7" rx="8" ry="3" fill="none" stroke="#64748b" stroke-width="2"/><path d="M4 7v10c0 1.66 3.58 3 8 3s8-1.34 8-3V7" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>